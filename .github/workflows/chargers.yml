name: Şarj istasyonu listesi

on:
  schedule:
    - cron: "17 */6 * * *"   # 6 saatte bir; detayı eksik istasyonlar her çalıştırmada biraz daha tamamlanır, tamamlanınca birkaç dakikada biter
  workflow_dispatch:

permissions:
  contents: write

# Önceki çalıştırma bitmeden yenisi başlamasın.
concurrency:
  group: chargers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # EPDK detay sorgusu çok yavaş (~1.200 istasyon / 5 saat); bilinen istasyonlar tekrar sorulmaz, yalnızca eksikler ve yeniler.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Listeyi yenile
        run: python3 scripts/update_chargers.py --out chargers_tr.json --workers 4 --delay 0.1 --budget 320
      - name: Değiştiyse kaydet
        run: |
          if git diff --quiet chargers_tr.json; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chargers_tr.json
          git commit -m "chargers: $(date -u +%F)"
          git pull --rebase -q
          git push
