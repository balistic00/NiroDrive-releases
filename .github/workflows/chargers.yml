name: Şarj istasyonu listesi

on:
  schedule:
    - cron: "0 3 * * 1"   # her pazartesi 06:00 (TR)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Listeyi yenile
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: python3 scripts/update_chargers.py --out chargers_tr.json
      - name: Değiştiyse kaydet
        run: |
          if git diff --quiet chargers_tr.json; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chargers_tr.json
          git commit -m "chargers: $(date -u +%F)"
          git push
